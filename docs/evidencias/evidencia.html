<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidencia de API RESTful</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f6f8;
      color: #17212b;
      font-family: "Segoe UI", Arial, sans-serif;
    }
    .appbar {
      height: 68px;
      display: flex;
      align-items: center;
      padding: 0 42px;
      color: #ffffff;
      background: #17212b;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .18);
    }
    .brand { font-size: 21px; font-weight: 700; letter-spacing: .2px; }
    .subtitle { margin-left: 18px; color: #aeb8c2; font-size: 14px; }
    main { width: min(1480px, calc(100% - 72px)); margin: 34px auto 54px; }
    .title { margin: 0 0 8px; font-size: 28px; }
    .description { margin: 0 0 28px; color: #5d6975; font-size: 16px; }
    .panel {
      overflow: hidden;
      background: #ffffff;
      border: 1px solid #dfe4e8;
      border-radius: 10px;
      box-shadow: 0 8px 26px rgba(24, 39, 55, .08);
    }
    .request {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 22px;
      border-bottom: 1px solid #e5e9ed;
      background: #fbfcfd;
    }
    .method {
      min-width: 70px;
      padding: 8px 12px;
      border-radius: 6px;
      color: #ffffff;
      text-align: center;
      font-size: 14px;
      font-weight: 800;
    }
    .GET { background: #16845b; }
    .POST { background: #d87513; }
    .url {
      flex: 1;
      padding: 10px 13px;
      border: 1px solid #cfd6dc;
      border-radius: 6px;
      background: #ffffff;
      color: #2c3742;
      font: 15px Consolas, monospace;
    }
    .section { padding: 22px; border-bottom: 1px solid #e5e9ed; }
    .section:last-child { border-bottom: 0; }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-weight: 700;
    }
    .status {
      padding: 6px 11px;
      border-radius: 999px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 800;
    }
    .success { background: #16845b; }
    .client-error { background: #c23b32; }
    pre {
      margin: 0;
      padding: 18px 20px;
      overflow: hidden;
      border: 1px solid #273849;
      border-radius: 7px;
      background: #101820;
      color: #d9e3ec;
      font: 14px/1.48 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 18px;
      color: #6a7681;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand">API REST Client</div>
    <div class="subtitle">Laboratorio Semana 05</div>
  </header>
  <main>
    <h1 class="title" id="title"></h1>
    <p class="description" id="description"></p>
    <article class="panel">
      <div class="request">
        <span class="method" id="method"></span>
        <div class="url" id="url"></div>
      </div>
      <section class="section" id="request-section">
        <div class="section-title">Request body</div>
        <pre id="request-body"></pre>
      </section>
      <section class="section">
        <div class="section-title">
          <span>Response body</span>
          <span class="status" id="status"></span>
        </div>
        <pre id="response-body"></pre>
      </section>
    </article>
    <div class="footer">
      <span>Proyecto DAWA S5</span>
      <span>Respuesta verificada en http://localhost:3000</span>
    </div>
  </main>
  <script>
    const ticket = {
      id: "20886693-63ed-4f85-80f7-6b34b71dccf4",
      title: "Prueba final de correo",
      description: "Comprobación del envío con Nodemailer",
      status: "nuevo",
      priority: "high",
      assignedUser: null
    };

    const views = {
      create: {
        title: "Creación de un ticket",
        description: "El ticket se registra y genera una notificación por correo.",
        method: "POST",
        url: "http://localhost:3000/tickets",
        request: {
          title: "Prueba final de correo",
          description: "Comprobación del envío con Nodemailer",
          priority: "high"
        },
        response: ticket,
        status: "201 Created",
        statusClass: "success"
      },
      pagination: {
        title: "Paginación de tickets",
        description: "La API limita los resultados y devuelve metadatos de navegación.",
        method: "GET",
        url: "http://localhost:3000/tickets?page=1&limit=5",
        response: {
          data: [
            {
              id: "2b2da420-fa36-415f-8ca4-1da3836058d2",
              title: "Prueba de correo DAWA",
              status: "nuevo",
              priority: "medium"
            },
            {
              id: "f38a3df0-331c-42ab-839e-f48d53c64085",
              title: "Prueba de correo",
              status: "nuevo",
              priority: "high"
            },
            {
              id: "f757a30e-6e96-430f-9665-b865fe883e28",
              title: "Prueba de correo",
              status: "nuevo",
              priority: "high"
            },
            {
              id: "e7e4de96-3260-440f-a9a8-d9955627cb2f",
              title: "Prueba final de correo",
              status: "nuevo",
              priority: "high"
            },
            {
              id: "4cfcebf7-3c7e-44f7-80e7-603e4078fa1d",
              title: "Prueba final de correo",
              status: "nuevo",
              priority: "high"
            }
          ],
          pagination: { page: 1, limit: 5, total: 7, totalPages: 2 }
        },
        status: "200 OK",
        statusClass: "success"
      },
      notifications: {
        title: "Notificaciones por ticket",
        description: "La notificación confirma que el correo real fue procesado correctamente.",
        method: "GET",
        url: "http://localhost:3000/tickets/20886693-63ed-4f85-80f7-6b34b71dccf4/notifications",
        response: [
          {
            id: "1e6b7f1c-2aac-41a9-a847-6ed6a48390fc",
            type: "email",
            message: "Nuevo ticket creado: Prueba final de correo",
            status: "sent",
            ticketId: "20886693-63ed-4f85-80f7-6b34b71dccf4"
          }
        ],
        status: "200 OK",
        statusClass: "success"
      },
      error: {
        title: "Manejo global de errores",
        description: "Los parámetros inválidos producen una respuesta HTTP uniforme.",
        method: "GET",
        url: "http://localhost:3000/tickets?page=0&limit=5",
        response: {
          error: "El parámetro page debe ser un entero mayor a 0"
        },
        status: "400 Bad Request",
        statusClass: "client-error"
      }
    };

    const key = new URLSearchParams(window.location.search).get("view") || "create";
    const view = views[key] || views.create;
    document.getElementById("title").textContent = view.title;
    document.getElementById("description").textContent = view.description;
    const method = document.getElementById("method");
    method.textContent = view.method;
    method.classList.add(view.method);
    document.getElementById("url").textContent = view.url;
    const requestSection = document.getElementById("request-section");
    if (view.request) {
      document.getElementById("request-body").textContent = JSON.stringify(view.request, null, 2);
    } else {
      requestSection.style.display = "none";
    }
    document.getElementById("response-body").textContent = JSON.stringify(view.response, null, 2);
    const status = document.getElementById("status");
    status.textContent = view.status;
    status.classList.add(view.statusClass);
  </script>
</body>
</html>
